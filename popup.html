<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora Livre</title>
    <style>
      :root { color-scheme: light; --blue:#3483fa; --green:#00a650; --yellow:#ffe600; --ink:#333; --muted:#666; --line:#ddd; --surface:#fff; --bg:#f5f5f5; }
      * { box-sizing:border-box; }
      body { width:380px; margin:0; background:var(--bg); color:var(--ink); font-family:"Proxima Nova",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      header { padding:18px 20px; background:var(--yellow); }
      header h1 { margin:0; font-size:22px; letter-spacing:-.3px; }
      header p { margin:4px 0 0; color:#555; font-size:13px; }
      main { padding:16px; }
      form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      label { display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--muted); }
      input[type="number"] { width:100%; border:1px solid var(--line); border-radius:6px; padding:10px; font:inherit; font-size:14px; color:var(--ink); background:var(--surface); outline:none; }
      input[type="number"]:focus { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
      .full { grid-column:1 / -1; }
      .toggle { flex-direction:row; align-items:center; justify-content:space-between; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:12px; color:var(--ink); }
      .toggle input { width:18px; height:18px; accent-color:var(--blue); }
      button { grid-column:1 / -1; border:0; border-radius:6px; padding:12px; background:var(--blue); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
      button:hover { background:#2968c8; }
      #status { grid-column:1 / -1; min-height:18px; margin:0; text-align:center; font-size:12px; color:var(--green); }
      footer { padding:0 16px 16px; color:#777; font-size:11px; text-align:center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Calculadora Livre</h1>
      <p>Configurações de precificação</p>
    </header>
    <main>
      <form id="settings-form">
        <label>Imposto padrão (%)<input id="taxPercent" name="taxPercent" type="number" min="0" max="100" step="0.1" required></label>
        <label>Embalagem (R$)<input id="packagingCost" name="packagingCost" type="number" min="0" step="0.01" required></label>
        <label>Comissão Clássico (%)<input id="classicCommission" name="classicCommission" type="number" min="0" max="100" step="0.1" required></label>
        <label>Comissão Premium (%)<input id="premiumCommission" name="premiumCommission" type="number" min="0" max="100" step="0.1" required></label>
        <label class="toggle full" for="considerSubsidy"><span>Considerar subsídio do ML no recebimento</span><input id="considerSubsidy" name="considerSubsidy" type="checkbox"></label>
        <button type="submit">Salvar configurações</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer>
      Os cálculos são estimativas. Confirme as tarifas na sua conta.<br>
      <a href="privacy.html" target="_blank" style="color:var(--blue);text-decoration:none;margin-top:4px;display:inline-block;">Política de Privacidade</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
